<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Lucas Vandeputte</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --slate:#2E3639;
  --slate-d:#1F2528;
  --foam:#EDE9E1;
  --foam-2:#DFD9CE;
  --brass:#9C8355;
  --texte:#2E3639;
  --texte-sec:#6E7377;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Karla',system-ui,-apple-system,sans-serif;
}
body{
  font-family:var(--sans);color:var(--texte);background:var(--foam);line-height:1.65;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 5%;
}
.mark{width:52px;height:52px;margin-bottom:28px}
.code{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.14em;color:var(--brass);text-transform:uppercase;margin-bottom:10px}
h1{font-family:var(--serif);font-size:clamp(24px,4vw,30px);font-weight:600;color:var(--slate);margin-bottom:14px;max-width:480px}
p{font-size:15px;color:var(--texte-sec);max-width:420px;margin-bottom:32px}
.btn-home{
  display:inline-block;background:var(--brass);color:var(--slate-d);
  padding:14px 26px;border-radius:2px;font-size:14.5px;font-weight:700;text-decoration:none;
}
.btn-home:hover{background:#B39763}
</style>
</head>
<body>

<svg class="mark" width="52" height="52" viewBox="0 0 90 90">
  <polygon points="18,77 18,13 24,13 24,71 45,71 45,77" fill="#9C8355"/>
  <path d="M18,13 L45,77 L72,13" fill="none" stroke="#2E3639" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="15" y1="80" x2="75" y2="80" stroke="#9C8355" stroke-width="1.5"/>
</svg>

<div class="code">Erreur 404</div>
<h1>Cette page n'existe pas, ou plus.</h1>
<p>Le lien que vous avez suivi est peut-être incorrect, ou la page a été déplacée. Retournez à l'accueil pour continuer votre navigation.</p>
<a href="/" class="btn-home">Retour à l'accueil</a>

</body>
</html>
